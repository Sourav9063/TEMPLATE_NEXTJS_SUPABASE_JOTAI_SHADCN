name: Keep Supabase active

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      PGSSLMODE: require

    steps:
      - name: Query Supabase database
        run: |
          psql "$DATABASE_URL" \
            --set ON_ERROR_STOP=1 \
            --command "SELECT current_database(), now();"
